[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasxpress-anywidget"
version = "0.1.1"
description = "CanvasXpress interactive charts as Jupyter / Colab / VS Code / marimo notebook widgets via anywidget"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Isaac Neuhaus", email = "imnphd@gmail.com" }]
keywords = ["canvasxpress", "visualization", "jupyter", "anywidget", "bioinformatics", "genomics"]
dependencies = ["anywidget>=0.9.0"]

[project.urls]
Homepage = "https://canvasxpress.org"
Documentation = "https://canvasxpress.org/documentation.html"
Source = "https://github.com/neuhausi/canvasXpress"

[tool.hatch.build.targets.wheel]
packages = ["src/canvasxpress_anywidget"]

# The repo-wide .gitignore ignores **/__init__.py, and hatchling's VCS-aware file
# selection would otherwise drop it from the wheel; force it back in. (widget.js is
# not ignored, so it is included via `packages`.)
[tool.hatch.build.targets.wheel.force-include]
"src/canvasxpress_anywidget/__init__.py" = "canvasxpress_anywidget/__init__.py"
