[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasxpress-magic"
version = "0.1.0"
description = "A %%cxplot IPython/Jupyter magic for CanvasXpress interactive charts (no build step)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Isaac Neuhaus", email = "imnphd@gmail.com" }]
keywords = ["canvasxpress", "visualization", "jupyter", "ipython", "magic", "bioinformatics"]
dependencies = ["ipython>=7.0"]

[project.urls]
Homepage = "https://canvasxpress.org"
Documentation = "https://canvasxpress.org/documentation.html"
Source = "https://github.com/neuhausi/canvasXpress"

[tool.hatch.build.targets.wheel]
packages = ["src/canvasxpress_magic"]

# Repo-wide .gitignore ignores **/__init__.py; force it into the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/canvasxpress_magic/__init__.py" = "canvasxpress_magic/__init__.py"
