[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasxpress-dash"
version = "0.1.0"
description = "CanvasXpress interactive charts in Dash apps (no build step)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Isaac Neuhaus", email = "imnphd@gmail.com" }]
keywords = ["canvasxpress", "visualization", "dash", "plotly", "bioinformatics", "genomics"]
dependencies = ["dash>=2.0"]

[project.urls]
Homepage = "https://canvasxpress.org"
Documentation = "https://canvasxpress.org/documentation.html"
Source = "https://github.com/neuhausi/canvasXpress"

[tool.hatch.build.targets.wheel]
packages = ["src/canvasxpress_dash"]

# Repo-wide .gitignore ignores **/__init__.py; force it into the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/canvasxpress_dash/__init__.py" = "canvasxpress_dash/__init__.py"
